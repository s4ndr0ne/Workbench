<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workbench</title>
<style>
  :root {
    --bg-primary:   #0f1117;
    --bg-card:      #181a22;
    --bg-card-alt:  #1e2029;
    --border:       #2a2d38;
    --text-primary: #e1e3ea;
    --text-dim:     #6b7089;
    --accent:       #4f8bf9;
    --accent-dim:   #2e4a8a;
    --green:        #22c55e;
    --yellow:       #eab308;
    --red:          #ef4444;
    --orange:       #f97316;
    --radius:       10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
  }

  /* --- HEADER --- */
  .header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 .icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 15px;
    color: white;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .status-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .status-healthy  { background: #22c55e20; color: var(--green); }
  .status-degraded { background: #eab30820; color: var(--yellow); }
  .status-unhealthy{ background: #ef444420; color: var(--red); }
  .status-unknown  { background: #6b708920; color: var(--text-dim); }

  /* --- LAYOUT --- */
  .content {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-dim);
    margin-bottom: 10px;
    margin-top: 24px;
  }
  .grid {
    display: grid;
    gap: 14px;
  }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 900px) {
    .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  }

  /* --- CARDS --- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }
  .metric-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .metric-card .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-dim);
  }
  .metric-card .value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.5px;
  }
  .metric-card .sub {
    font-size: 12px;
    color: var(--text-dim);
  }
  .metric-card .value.blue  { color: var(--accent); }
  .metric-card .value.green { color: var(--green); }
  .metric-card .value.orange{ color: var(--orange); }

  /* --- CHART --- */
  .chart-container {
    position: relative;
    height: 200px;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- HEALTH TABLE --- */
  .health-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .health-table th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .health-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .health-table tr:last-child td { border-bottom: none; }
  .health-table .status {
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    display: inline-block;
  }
  .health-table .status-healthy   { background: #22c55e20; color: var(--green); }
  .health-table .status-degraded  { background: #eab30820; color: var(--yellow); }
  .health-table .status-unhealthy { background: #ef444420; color: var(--red); }
  .health-table .duration { color: var(--text-dim); }
  .health-table .desc { color: var(--text-dim); font-style: italic; }

  /* --- INFO ROWS --- */
  .info-rows { display: flex; flex-direction: column; gap: 0; }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    gap: 12px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .key { color: var(--text-dim); white-space: nowrap; }
  .info-row .val { font-weight: 500; text-align: right; word-break: break-all; }

  /* --- REQUEST LOG --- */
  .log-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    margin-left: 6px;
    background: var(--accent-dim);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .log-container {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    max-height: 420px;
    overflow-y: auto;
  }
  .log-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .time { color: var(--text-dim); width: 70px; flex-shrink: 0; }
  .log-entry .method {
    width: 52px;
    flex-shrink: 0;
    font-weight: 700;
    text-align: center;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .method-get    { background: #4f8bf930; color: var(--accent); }
  .method-post   { background: #22c55e30; color: var(--green); }
  .method-put    { background: #eab30830; color: var(--yellow); }
  .method-patch  { background: #f9731630; color: var(--orange); }
  .method-delete { background: #ef444430; color: var(--red); }
  .log-entry .path {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-primary);
  }
  .log-entry .status {
    width: 44px;
    flex-shrink: 0;
    text-align: right;
    font-weight: 700;
  }
  .status-2xx { color: var(--green); }
  .status-3xx { color: var(--accent); }
  .status-4xx { color: var(--yellow); }
  .status-5xx { color: var(--red); }
  .log-entry .dur {
    width: 56px;
    flex-shrink: 0;
    text-align: right;
    color: var(--text-dim);
  }
  .log-entry .ip { color: var(--text-dim); width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
  .log-entry .body {
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #9aa0b8;
    opacity: .85;
  }
  .log-entry .body.none { color: var(--text-dim); opacity: .5; font-style: italic; }
  .log-detail {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    margin: 4px 0 8px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
    display: none;
  }
  .log-entry { cursor: pointer; }
  .log-entry:hover { background: var(--bg-card-alt); }

  /* --- API EXPLORER --- */
  .endpoint {
    border-bottom: 1px solid var(--border);
  }
  .endpoint:last-child { border-bottom: none; }
  .endpoint-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 8px;
    cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
  }
  .endpoint-head:hover { background: var(--bg-card-alt); }
  .endpoint-head .method-pill {
    width: 58px;
    flex-shrink: 0;
    text-align: center;
    font-weight: 700;
    font-size: 11px;
    padding: 3px 0;
    border-radius: 5px;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .endpoint-head .path { flex: 1; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; }
  .endpoint-head .chevron { color: var(--text-dim); transition: transform .15s ease; }
  .endpoint.open .chevron { transform: rotate(90deg); }
  .endpoint-body {
    display: none;
    padding: 0 8px 16px 78px;
    gap: 14px;
  }
  .endpoint.open .endpoint-body { display: flex; flex-direction: column; }

  .api-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .api-form .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .api-form label {
    font-size: 12px;
    color: var(--text-dim);
    min-width: 90px;
    text-transform: uppercase;
    letter-spacing: .4px;
    font-weight: 600;
  }
  .api-form input[type="text"], .api-form textarea {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 8px 10px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    flex: 1;
    outline: none;
  }
  .api-form input[type="text"]:focus, .api-form textarea:focus {
    border-color: var(--accent);
  }
  .api-form textarea { min-height: 70px; resize: vertical; }
  .api-form select {
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    padding: 7px 10px;
    font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
    outline: none;
  }
  .send-btn {
    align-self: flex-start;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .3px;
  }
  .send-btn:hover { background: #5c97ff; }
  .send-btn:disabled { opacity: .5; cursor: wait; }
  .api-response {
    display: none;
    margin-top: 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-primary);
    overflow: hidden;
  }
  .api-response .resp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    font-family: ui-monospace, Menlo, monospace;
  }
  .api-response .resp-status { font-weight: 700; }
  .api-response pre {
    margin: 0;
    padding: 12px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
    color: var(--text-primary);
  }
  .status-2xx-text { color: var(--green); }
  .status-4xx-text { color: var(--yellow); }
  .status-5xx-text { color: var(--red); }

  /* --- LOADING --- */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-dim);
    font-size: 13px;
    gap: 8px;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-banner {
    background: #ef444418;
    border: 1px solid #ef444440;
    color: var(--red);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 13px;
    margin: 10px 0;
    display: none;
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span class="icon">W</span>
    Workbench
  </h1>
  <div class="status-badge status-unknown" id="status-badge">
    <span class="dot"></span>
    <span id="status-text">Connecting…</span>
  </div>
</div>

<div class="content" id="app">
  <div class="error-banner" id="error-banner"></div>

  <div class="section-title">Live Metrics</div>
  <div class="grid grid-4" id="live-metrics">
    <div class="card metric-card">
      <span class="label">CPU</span>
      <span class="value blue" id="m-cpu">--</span>
      <span class="sub">avg</span>
    </div>
    <div class="card metric-card">
      <span class="label">Working Set</span>
      <span class="value green" id="m-working">--</span>
      <span class="sub">MB</span>
    </div>
    <div class="card metric-card">
      <span class="label">Heap</span>
      <span class="value green" id="m-heap">--</span>
      <span class="sub">MB</span>
    </div>
    <div class="card metric-card">
      <span class="label">Uptime</span>
      <span class="value orange" id="m-uptime">--</span>
      <span class="sub" id="m-pid">PID --</span>
    </div>
  </div>

  <div class="section-title">Metrics History</div>
  <div class="grid grid-2">
    <div class="card">
      <div class="label" style="margin-bottom:10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);">CPU %</div>
      <div class="chart-container">
        <canvas id="chart-cpu"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="label" style="margin-bottom:10px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim);">Memory MB</div>
      <div class="chart-container">
        <canvas id="chart-mem"></canvas>
      </div>
    </div>
  </div>

  <div class="section-title">Runtime</div>
  <div class="grid grid-2">
    <div class="card">
      <div class="info-rows" id="process-info"></div>
    </div>
    <div class="card">
      <div class="info-rows" id="runtime-info"></div>
    </div>
  </div>

  <div class="section-title">Health Checks</div>
  <div class="card" id="health-card">
    <div class="loading" id="health-loading"><div class="spinner"></div> Loading health…</div>
  </div>

  <div class="section-title">API Explorer</div>
  <div class="card" id="api-explorer">
    <div class="loading"><div class="spinner"></div> Loading endpoints…</div>
  </div>

  <div class="section-title">Request Log <span class="log-count" id="req-count"></span></div>
  <div class="card">
    <div class="log-container" id="request-log">
      <div class="loading"><div class="spinner"></div> Waiting for requests…</div>
    </div>
  </div>
</div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const badge  = $('status-badge');
  const statusText = $('status-text');
  const errorBanner = $('error-banner');

  let refreshMs  = 5000;

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  // --- API Explorer ---
  const VERBS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'HEAD', 'OPTIONS'];
  let endpoints = [];

  function methodPillClass(method) {
    const m = method.toUpperCase();
    if (m === 'ANY') return 'method-get';
    return 'method-' + m.toLowerCase();
  }

  function fillPath(ep) {
    let path = ep.path;
    ep.parameters.forEach(name => {
      const input = document.getElementById('param-' + ep.index + '-' + name);
      const val = input ? input.value.trim() : '';
      path = path.replace(new RegExp('\\{' + name + '(\\:[^}]*)?(\\?|\\*)?\\}'), val || ('{' + name + '}'));
    });
    return path;
  }

  function endpointHtml(ep) {
    const params = ep.parameters.length
      ? '<div class="row" style="margin-top:6px">'
        + '<label>Path</label><div style="flex:1;display:flex;gap:8px;flex-wrap:wrap">'
        + ep.parameters.map(name =>
            '<input type="text" id="param-' + ep.index + '-' + name + '" placeholder="{' + name + '}" style="flex:0 1 180px" />')
          .join('')
        + '</div></div>'
      : '';

    const methodSelect = ep.method === 'ANY'
      ? '<select id="verb-' + ep.index + '">' + VERBS.map(v => '<option>' + v + '</option>').join('') + '</select>'
      : '';

    const bodyRow = ['POST', 'PUT', 'PATCH'].includes(ep.method === 'ANY' ? 'POST' : ep.method)
      ? '<div class="row"><label>Body</label><textarea id="body-' + ep.index + '" placeholder="{\\n  \\"key\\": \\"value\\"\\n}"></textarea></div>'
      : '';

    return '<div class="endpoint" id="ep-' + ep.index + '" data-index="' + ep.index + '">'
      + '<div class="endpoint-head">'
      + '<span class="method-pill ' + methodPillClass(ep.method) + '">' + ep.method + '</span>'
      + '<span class="path">' + ep.path + '</span>'
      + '<span class="chevron">&#9654;</span>'
      + '</div>'
      + '<div class="endpoint-body">'
      + '<div class="api-form">'
      + (params || '')
      + (methodSelect ? '<div class="row"><label>Method</label>' + methodSelect + '</div>' : '')
      + bodyRow
      + '<div class="row"><button class="send-btn" data-send="' + ep.index + '">Send</button></div>'
      + '</div>'
      + '<div class="api-response" id="resp-' + ep.index + '">'
      + '<div class="resp-head"><span class="resp-status" id="resp-status-' + ep.index + '"></span><span id="resp-time-' + ep.index + '"></span></div>'
      + '<pre id="resp-body-' + ep.index + '"></pre>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  function renderEndpoints() {
    const box = $('api-explorer');
    if (!endpoints.length) {
      box.innerHTML = '<div style="padding:12px; color:var(--text-dim); font-size:13px;">No endpoints discovered. Map some routes first.</div>';
      return;
    }
    box.innerHTML = '<div style="padding:8px 4px 12px; color:var(--text-dim); font-size:12px;">'
      + endpoints.length + ' endpoints — click to expand and call.</div>'
      + endpoints.map(endpointHtml).join('');
  }

  async function loadEndpoints() {
    try {
      endpoints = await fetchJSON('api/endpoints');
      endpoints.forEach((ep, i) => ep.index = i);
      renderEndpoints();
    } catch (err) {
      $('api-explorer').innerHTML = '<div style="padding:12px; color:var(--text-dim); font-size:13px;">Unable to load endpoints: ' + (err.message || err) + '</div>';
    }
  }

  function statusTextClass(code) {
    if (code >= 200 && code < 300) return 'status-2xx-text';
    if (code >= 400 && code < 500) return 'status-4xx-text';
    if (code >= 500) return 'status-5xx-text';
    return '';
  }

  async function callEndpoint(ep) {
    const verb = ep.method === 'ANY'
      ? (document.getElementById('verb-' + ep.index).value || 'GET')
      : ep.method;
    const hasBody = ['POST', 'PUT', 'PATCH', 'DELETE'].includes(verb);
    const bodyInput = document.getElementById('body-' + ep.index);
    const bodyVal = bodyInput ? bodyInput.value.trim() : '';
    const url = fillPath(ep);

    const respBox = $('resp-' + ep.index);
    const respStatus = $('resp-status-' + ep.index);
    const respTime = $('resp-time-' + ep.index);
    const respBody = $('resp-body-' + ep.index);
    respBox.style.display = 'block';
    respStatus.textContent = '…';
    respTime.textContent = '';

    const sw = performance.now();
    try {
      const headers = {};
      if (hasBody && bodyVal) {
        headers['Content-Type'] = 'application/json';
      }
      const r = await fetch(url, {
        method: verb,
        headers,
        body: hasBody ? bodyVal : undefined,
      });
      const ms = Math.round(performance.now() - sw);
      const text = await r.text();
      respStatus.textContent = r.status + ' ' + r.statusText;
      respStatus.className = 'resp-status ' + statusTextClass(r.status);
      respTime.textContent = ms + ' ms';
      respBody.textContent = prettyPrint(text);
    } catch (err) {
      respStatus.textContent = 'Network Error';
      respStatus.className = 'resp-status status-5xx-text';
      respBody.textContent = err.message || String(err);
    }
  }

  function prettyPrint(text) {
    if (!text) return '(empty response)';
    if (text.startsWith('{') || text.startsWith('[')) {
      try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { /* fallthrough */ }
    }
    return text;
  }

  document.addEventListener('click', function (evt) {
    const sendBtn = evt.target.closest('[data-send]');
    if (sendBtn) {
      const idx = parseInt(sendBtn.getAttribute('data-send'), 10);
      callEndpoint(endpoints[idx]);
      return;
    }
    const head = evt.target.closest('.endpoint-head');
    if (head) {
      head.parentElement.classList.toggle('open');
    }
  });

  loadEndpoints();

  function showError(msg) {
    errorBanner.textContent = 'Unable to reach Workbench API: ' + msg;
    errorBanner.style.display = 'block';
    badge.className = 'status-badge status-unhealthy';
    statusText.textContent = 'Error';
  }

  function clearError() {
    errorBanner.style.display = 'none';
  }

  function setBadge(status) {
    const map = { Healthy: 'status-healthy', Degraded: 'status-degraded',
                  Unhealthy: 'status-unhealthy', NoHealthChecks: 'status-unknown',
                  Disabled: 'status-unknown' };
    badge.className = 'status-badge ' + (map[status] || 'status-unknown');
    statusText.textContent = status || 'Unknown';
  }

  function fillInfo(container, rows) {
    container.innerHTML = rows.map(([k, v]) =>
      '<div class="info-row"><span class="key">' + k + '</span><span class="val">' + (v ?? '--') + '</span></div>'
    ).join('');
  }

  function drawLine(canvasId, data, color, label, maxVal) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !data.length) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;
    const pad = { top: 8, right: 12, bottom: 22, left: 46 };
    const plotW = W - pad.left - pad.right;
    const plotH = H - pad.top - pad.bottom;

    ctx.clearRect(0, 0, W, H);

    const values = data.map(d => d.value);
    const ceiling = maxVal || Math.max(1, ...values) * 1.2;

    // grid lines
    ctx.strokeStyle = '#2a2d38';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.top + (plotH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillStyle = '#6b7089';
      ctx.font = '10px system-ui';
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(ceiling - (ceiling / 4) * i), pad.left - 6, y + 3);
    }

    // label
    ctx.fillStyle = '#6b7089';
    ctx.font = '10px system-ui';
    ctx.textAlign = 'right';
    ctx.fillText(label, W - pad.right, H - 4);

    // line
    const points = values.map((v, i) => ({
      x: pad.left + (i / Math.max(1, values.length - 1)) * plotW,
      y: pad.top + plotH - (v / ceiling) * plotH,
    }));

    // gradient fill
    const grad = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
    grad.addColorStop(0, color + '40');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.moveTo(points[0].x, H - pad.bottom);
    points.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineTo(points[points.length - 1].x, H - pad.bottom);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // line stroke
    ctx.beginPath();
    points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // dot on last point
    const last = points[points.length - 1];
    ctx.beginPath();
    ctx.arc(last.x, last.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#0f1117';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function renderHealth(report) {
    const card = $('health-card');
    if (!report || !report.entries || report.entries.length === 0) {
      card.innerHTML = '<div style="padding:12px; color:var(--text-dim); font-size:13px;">No health checks registered.</div>';
      return;
    }
    let html = '<table class="health-table"><thead><tr><th>Name</th><th>Status</th><th>Duration</th><th>Message</th></tr></thead><tbody>';
    report.entries.forEach(e => {
      const cls = 'status-' + (e.status || '').toLowerCase();
      html += '<tr>'
        + '<td style="font-weight:500">' + (e.name || '') + '</td>'
        + '<td><span class="status ' + cls + '">' + (e.status || '') + '</span></td>'
        + '<td class="duration">' + (e.duration ? Math.round(e.duration / 1000) + ' ms' : '--') + '</td>'
        + '<td class="desc">' + (e.description || '') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    card.innerHTML = html;
  }

  // --- Request log ---
  let reqLog = [];          // newest first
  let reqInitialized = false;

  function methodClass(method) {
    return 'method-' + (method || '').toLowerCase();
  }
  function statusClass(status) {
    const s = (status || 0);
    return s < 300 ? 'status-2xx' : s < 400 ? 'status-3xx' : s < 500 ? 'status-4xx' : 'status-5xx';
  }
  function bodyPreview(body) {
    if (body == null || body === '') return '<span class="body none">— no body —</span>';
    const t = String(body);
    return '<span class="body">' + (t.length > 160 ? t.slice(0, 160) + '…' : t) + '</span>';
  }

  function reqHtml(e) {
    const t = new Date(e.timestampUtc);
    const time = t.toLocaleTimeString('it-IT', { hour12: false }) + '.' + String(t.getMilliseconds()).padStart(3, '0');
    const hasBody = e.requestBody != null && e.requestBody !== '';
    const safeBody = hasBody
      ? String(e.requestBody).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      : '';
    return '<div class="log-entry" data-path="' + (e.path || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">'
      + '<span class="time">' + time + '</span>'
      + '<span class="method ' + methodClass(e.method) + '">' + (e.method || '') + '</span>'
      + '<span class="path">' + (e.path || '') + '</span>'
      + '<span class="status ' + statusClass(e.statusCode) + '">' + (e.statusCode ?? '') + '</span>'
      + '<span class="dur">' + (e.durationMs != null ? e.durationMs + ' ms' : '') + '</span>'
      + '<span class="ip">' + (e.remoteIp || '') + '</span>'
      + '</div>'
      + (hasBody ? '<div class="log-detail">' + safeBody + '</div>' : '');
  }

  function renderRequestLog() {
    const box = $('request-log');
    $('req-count').textContent = reqLog.length ? reqLog.length + ' reqs' : '';
    if (!reqLog.length) {
      box.innerHTML = '<div class="loading"><div class="spinner"></div> Waiting for requests…</div>';
      return;
    }
    box.innerHTML = reqLog.map(reqHtml).join('');
  }

  function addRequestEntry(e) {
    const existing = reqLog.findIndex(r =>
      r.timestampUtc === e.timestampUtc && r.traceId === e.traceId);
    if (existing >= 0) return;
    reqLog.unshift(e);
    if (reqLog.length > 500) reqLog.length = 500;

    const box = $('request-log');
    $('req-count').textContent = reqLog.length + ' reqs';
    box.insertAdjacentHTML('afterbegin', reqHtml(e));
    while (box.children.length > 500) box.removeChild(box.lastChild);
  }

  // toggle : expanded body on click
  document.addEventListener('click', function (evt) {
    const entry = evt.target.closest('.log-entry');
    if (!entry) return;
    const detail = entry.nextElementSibling;
    if (detail && detail.classList.contains('log-detail')) {
      detail.style.display = detail.style.display === 'block' ? 'none' : 'block';
    }
  });

  // --- SSE real-time stream ---
  const source = new EventSource('api/stream');

  source.addEventListener('overview', function (evt) {
    const data = JSON.parse(evt.data);
    clearError();
    setBadge(data.healthStatus);

    // live metrics
    const runtime = data.runtime || {};
    const proc    = data.process   || {};
    const samples = data.samples   || [];
    const last    = samples[samples.length - 1] || {};

    $('m-cpu').textContent     = last.cpuPercent != null ? last.cpuPercent + '%' : '--';
    $('m-working').textContent = last.workingSetMb != null ? last.workingSetMb : '--';
    $('m-heap').textContent    = last.managedHeapMb != null ? last.managedHeapMb : '--';
    $('m-uptime').textContent  = proc.uptime || '--';
    $('m-pid').textContent     = 'PID ' + (proc.processId || '--');

    // process info
    fillInfo($('process-info'), [
      ['Application', proc.applicationName],
      ['Environment', proc.environment],
      ['Machine',     proc.machineName],
      ['Process ID',  proc.processId],
      ['Started (UTC)',proc.startedAtUtc],
      ['Working Dir', proc.workingDirectory],
      ['OS',          proc.operatingSystem],
    ]);

    // runtime info
    fillInfo($('runtime-info'), [
      ['Runtime',          proc.runtimeVersion],
      ['Working Set',      proc.workingSetMb + ' MB'],
      ['Private Memory',   proc.privateMemoryMb + ' MB'],
      ['Virtual Memory',   proc.virtualMemoryMb + ' MB'],
      ['Threads',          proc.threadCount],
      ['GC Gen 0 / 1 / 2', [runtime.gen0Collections, runtime.gen1Collections, runtime.gen2Collections].join(' / ')],
      ['Heap Size',        runtime.heapSizeMb + ' MB'],
      ['CPU Usage',        runtime.cpuUsagePercent + '%'],
    ]);

    // charts
    refreshMs = data.refreshIntervalMs || 5000;
    if (samples.length) {
      drawLine('chart-cpu',  samples.map(s => ({ value: s.cpuPercent })),   '#4f8bf9', 'last ' + samples.length + ' samples', 100);
      drawLine('chart-mem',  samples.map(s => ({ value: s.workingSetMb })),'#22c55e', 'last ' + samples.length + ' samples');
    }

    // request log (seed once from history snapshot; newest first)
    if (!reqInitialized) {
      reqLog = (data.recentRequests || []).slice().sort((a, b) =>
        new Date(b.timestampUtc) - new Date(a.timestampUtc));
      reqInitialized = true;
      renderRequestLog();
    }
  });

  source.addEventListener('health', function (evt) {
    renderHealth(JSON.parse(evt.data));
  });

  source.addEventListener('request', function (evt) {
    addRequestEntry(JSON.parse(evt.data));
  });

  source.onopen = function () {
    clearError();
  };
  source.onerror = function () {
    showError('SSE lost — browser is reconnecting automatically…');
  };
})();
</script>
</body>
</html>
